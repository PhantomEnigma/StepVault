name: Build Debug and Release APKs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: stepvault-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Report release APK size
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            rm -f "release-$(basename "$apk").size"
            stat -c "%n %s bytes" "$apk" | tee "release-$(basename "$apk").size"
          done

      - name: Upload release APK and size report
        uses: actions/upload-artifact@v7
        with:
          name: stepvault-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            release-*.size
          if-no-files-found: error
          retention-days: 14

      - name: Run release lint
        run: ./gradlew :app:lintRelease --stacktrace --no-daemon
